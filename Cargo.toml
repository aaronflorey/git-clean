[package]
name = "git-clean"
version = "0.10.1"
authors = ["Matt Casper <matthewvcasper@gmail.com>"]
license = "MIT"
description = "A tool for cleaning old git branches."
documentation = "https://github.com/aaronflorey/git-clean"
homepage = "https://github.com/aaronflorey/git-clean"
repository = "https://github.com/aaronflorey/git-clean"
autotests = false
edition = "2021"
rust-version = "1.74"

[dependencies]
clap = "4.5"
regex = "1.12"
directories = "5.0"
toml = "0.8"

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dev-dependencies]
tempfile = "3.17"

[[test]]
name = "tests"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
exit = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"

[lints.clippy.pedantic]
level = "warn"
priority = -1
